<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hanwha Power Golf Check-In</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202a34;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:18px}.hero{background:#263340;color:white;padding:22px;border-radius:16px}.brand{color:#ff9c51;font-size:12px;letter-spacing:2px;font-weight:800}h1{margin:7px 0}h2{margin:4px 0 12px}.muted{color:#647080}.hero .muted{color:#cbd4df}.card{background:white;border:1px solid #e1e4e9;border-radius:14px;padding:16px;margin-top:14px}button,input,select{font:inherit}button{border:1px solid #cfd4dc;border-radius:9px;padding:10px 13px;background:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.orange{background:#ec7627;color:white;border-color:#ec7627;font-weight:700}.green{background:#e5f5e9;color:#136733;border-color:#bce2c4;font-weight:700}input,select{padding:12px;border:1px solid #cfd4dc;border-radius:9px;min-width:0;width:100%}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.space{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{text-align:center;background:white;padding:13px 5px;border:1px solid #e1e4e9;border-radius:12px}.num{font-size:30px;font-weight:800}.progress{height:8px;border-radius:9px;background:#e5e7eb;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#ec7627}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eceef1}.person:last-child{border-bottom:0}.name{font-weight:700}.small{font-size:13px}.tabs{display:flex;border-bottom:1px solid #ddd;margin-top:14px}.tabs button{flex:1;border:0;border-radius:0;background:transparent}.tabs .selected{border-bottom:3px solid #ec7627;color:#c85e13;font-weight:800}.team{border:1px solid #e1e4e9;border-radius:11px;margin-top:10px;padding:12px}summary{cursor:pointer;font-weight:700}.hide{display:none!important}#status{margin-top:10px;font-size:13px;color:#647080}.grow{flex:1}#list{margin-top:6px}@media(max-width:480px){.wrap{padding:10px}.hero{padding:18px}.person button{white-space:nowrap}.num{font-size:25px}}
</style></head><body><main class="wrap"><header class="hero"><div class="brand">HANWHA POWER</div><h1>Charity Golf Check-In</h1><div class="muted">Saturday, October 17, 2026</div></header>
<section id="login" class="card"><h2>Volunteer sign-in</h2><p class="muted">Enter your approved volunteer email to receive a secure sign-in link.</p><form id="loginForm" class="flex"><input id="email" type="email" placeholder="volunteer@company.com" required class="grow"><button class="orange" type="submit">Email sign-in link</button></form><p id="loginMessage" role="status" class="small"></p></section>
<section id="app" class="hide"><div class="card flex space"><span id="identity" class="small"></span><button id="logout">Sign out</button></div><div class="stats"><div class="stat"><div class="small muted">Golfers</div><div id="total" class="num">—</div></div><div class="stat"><div class="small muted">Arrived</div><div id="arrived" class="num" style="color:#188044">—</div></div><div class="stat"><div class="small muted">Missing</div><div id="missing" class="num">—</div></div></div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="tabs"><button class="selected" data-tab="check">Check-In</button><button data-tab="teams">Teams</button><button data-tab="report">Report</button></div><section id="check" class="card"><div class="flex"><input class="grow" id="search" placeholder="Search golfer or team"><select id="filter" style="max-width:180px"><option value="all">All golfers</option><option value="missing">Not arrived</option><option value="arrived">Checked in</option></select></div><div id="list"></div></section><section id="teams" class="card hide"><h2>Teams</h2><div id="teamList"></div></section><section id="report" class="card hide"><h2>Attendance report</h2><p class="muted">Download the current attendance roster for Excel.</p><button id="export" class="orange">Export CSV</button></section></section><div id="status" role="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./config.js"></script><script>
(async()=>{
 const $=id=>document.getElementById(id);const cfg=window.GOLF_CONFIG;
 if(!cfg||cfg.url.includes('YOUR_PROJECT')||cfg.publishableKey.includes('YOUR_KEY')){$('status').textContent='Setup needed: configure config.js with your Supabase project URL and publishable key.';return}
 const db=window.supabase.createClient(cfg.url,cfg.publishableKey);let players=[],teams=[],channel=null,user=null;
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const teamName=id=>teams.find(t=>t.id===id)?.name||'Unassigned';
 const msg=s=>$('status').textContent=s;
 async function load(){const [a,b]=await Promise.all([db.from('golf_teams').select('id,name').order('id'),db.from('golf_players').select('id,name,team_id,checked_in,checked_in_at').order('name')]);if(a.error||b.error){msg('Unable to load roster: '+(a.error||b.error).message);return}teams=a.data;players=b.data;if(!teams.length||!players.length)msg('No roster is visible. Ask the organizer to approve your email in golf_volunteers.');else msg('Connected · Attendance synchronized');render()}
 function render(){const total=players.length,arr=players.filter(p=>p.checked_in).length;$('total').textContent=total;$('arrived').textContent=arr;$('missing').textContent=total-arr;$('bar').style.width=(total?100*arr/total:0)+'%';const q=$('search').value.toLowerCase(),f=$('filter').value;let visible=players.filter(p=>(p.name+' '+teamName(p.team_id)).toLowerCase().includes(q)&&(f==='all'||(f==='arrived'?p.checked_in:!p.checked_in)));$('list').innerHTML=visible.map(person).join('')||'<p class="muted">No matching golfers.</p>';$('teamList').innerHTML=teams.map(t=>{let ps=players.filter(p=>p.team_id===t.id);return `<details class="team"><summary>${esc(t.name)} — ${ps.filter(p=>p.checked_in).length}/${ps.length} arrived</summary>${ps.map(person).join('')}</details>`}).join('')}
 function person(p){return `<div class="person"><div><div class="name">${esc(p.name)}</div><div class="small muted">${esc(teamName(p.team_id))}${p.checked_in?' · Arrived':''}</div></div><button data-check="${p.id}" class="${p.checked_in?'':'green'}">${p.checked_in?'Undo':'✓ Check In'}</button></div>`}
 async function check(id){const p=players.find(x=>x.id===id);if(!p)return;const next=!p.checked_in;msg('Saving check-in…');const {error}=await db.from('golf_players').update({checked_in:next,checked_in_at:next?new Date().toISOString():null}).eq('id',id);if(error){msg('Check-in failed: '+error.message);return}await load()}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-check]');if(b)check(Number(b.dataset.check));const t=e.target.closest('[data-tab]');if(t){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('selected',x===t));['check','teams','report'].forEach(x=>$(x).classList.toggle('hide',x!==t.dataset.tab))}});
 $('search').oninput=render;$('filter').onchange=render;
 $('export').onclick=()=>{const rows=[['Name','Team','Status','Checked in at'],...players.map(p=>[p.name,teamName(p.team_id),p.checked_in?'Arrived':'Not arrived',p.checked_in_at||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='hanwha-golf-attendance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('loginForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim().toLowerCase();const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});$('loginMessage').textContent=error?'Unable to send sign-in link: '+error.message:'Check your email for a sign-in link.'};
 $('logout').onclick=()=>db.auth.signOut();
 async function session(s){user=s?.user||null;$('login').classList.toggle('hide',!!user);$('app').classList.toggle('hide',!user);if(channel){await db.removeChannel(channel);channel=null}if(user){$('identity').textContent=user.email;await load();channel=db.channel('golf-attendance').on('postgres_changes',{event:'UPDATE',schema:'public',table:'golf_players'},()=>load()).subscribe()}else{players=[];teams=[];msg('Sign in to begin check-in.')}}
 db.auth.onAuthStateChange((_event,s)=>{setTimeout(()=>session(s),0)});const {data}=await db.auth.getSession();await session(data.session);
})();
</script></body></html>
